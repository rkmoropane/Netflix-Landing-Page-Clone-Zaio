<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Selectors | Challenge</title>
    <link rel="stylesheet" href="style-class-selectors.css">
</head>
<body>
    <h1 id="uniqueHeading">Unique Heading</h1>
    <p>This is a paragraph without any special styling.</p>
    <div class="highlight">This div has a yellow background.</div>
    <p id="specialParagraph">This paragraph has a font size of 18 pixels.</p>
    <div class="container">This div is in a blue container.</div>
</body>
