<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Tables | Challenge</title>
    <link rel="stylesheet" href="style-creating-tables.css">
</head>
<body>
    <h1>SmartWatch X1 Information</h1>
    <!-- Your code here  -->
    <table>
        <thead>
            <tr>
                <th>Attribute</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Product Name</td>
                <td>SmartWatch X1</td>
            </tr>
            <tr>
                <td>Description</td>
                <td>A sleek and advanced smartwatch with fitness tracking features.</td>
            </tr>
            <tr>
                <td>Display Type</td>
                <td>AMOLED</td>
            </tr>
            <tr>
                <td>Battery Life</td>
                <td>Up to 7 days</td>
            </tr>
            <tr>
                <td>Price</td>
                <td>$149.99</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
